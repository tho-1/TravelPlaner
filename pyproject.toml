# Tool configuration only.
#
# This repository is a Streamlit *application*, not a library: it is run with
# `streamlit run app.py` from a checkout, and nothing imports it from an
# installed distribution. It therefore deliberately has no [project] table and
# must not be pip-installed — `pip install -e .` fails setuptools' flat-layout
# package discovery ("multiple top-level packages discovered in a flat-layout:
# itinerary, pages, sync, tests"), which is what broke the first CI runs.
#
# Dependencies: requirements.txt (what Streamlit Cloud installs) and
# requirements-dev.txt (pytest + ruff, for local checks and CI).

[project]
# Metadata only — this project installs NOTHING (see [tool.setuptools] below).
# Runtime dependencies live in requirements.txt; dev tools in
# requirements-dev.txt.
name = "travel-planner"
version = "1.0.0"
description = "Streamlit travel planner: destinations catalogue, itinerary planner, local/cloud sync"
requires-python = ">=3.11"
dependencies = []

[build-system]
# Declared so that an accidental `pip install -e .` succeeds as a no-op instead
# of dying inside setuptools' flat-layout package discovery.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Kept free of plugin-only flags so the suite also runs on a bare pytest
# install: `python -m pytest` works without pytest-timeout/ruff installed.
addopts = "-q --strict-markers"
filterwarnings = [
    # Streamlit's cache manager complains when there is no running script; that
    # is expected in unit tests and says nothing about the code.
    "ignore:No runtime found:UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: tests that hit the network or the real workbook",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "archive", "Pictures", "itinerary_cache", "sync_journals"]

[tool.ruff.lint]
# F: pyflakes (unused imports/vars, undefined names) — catches real dead code.
# B023: closures over loop variables — a real bug class.
# I: import order. E4/E7/E9: the pycodestyle errors that matter.
# Deliberately *not* selected: B905 (zip strict=), B007, E741, E501 — these
# fire on correct, intentional code throughout this codebase.
select = ["E4", "E7", "E9", "F", "B023", "I"]
ignore = [
    "E501",   # long lines: the UI code has long HTML/CSS strings
    "B008",   # function call in default argument (st.* idiom)
]

[tool.ruff.lint.per-file-ignores]
# Tests may import without ordering, and the __main__ runner is intentional.
"tests/*" = ["E402", "F401"]
