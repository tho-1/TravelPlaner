name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The live app is mobile/ (Flutter desktop + Android). The Streamlit app and
# the Phase-3 web prototype moved to archive/ (frozen reference, restorable
# via the legacy-streamlit tag) - their 511-test Python suite, ruff and
# compileall gates retired with them and remain runnable from the tag.

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
