# 8G (the template default) is too much for this machine: Gradle and the
# Kotlin daemon each inherit it and RAM is tight.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental caches fail on this machine ("Could not close
# incremental caches" / paged-file-storage errors) -- the project path
# contains spaces ("Open Code  - Travel planner"), which the memory-mapped
# storage chokes on. Non-incremental compiles are slightly slower but
# reliable; the app is tiny, so the cost is seconds.
kotlin.incremental=false
